{% extends "base.html" %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <div class="terminal-border p-1 bg-green-900/20">
        <div class="bg-black p-8 border border-green-900">
            <div class="flex justify-between items-start mb-10">
                <div>
                    <h1 class="text-2xl font-bold text-white uppercase">{{ sfida.titolo }}</h1>
                    <p class="text-[10px] text-green-800 tracking-widest mt-1">DEVICE_ID: TAPE_READER_B_12</p>
                </div>
                <div class="text-right">
                    <span class="text-xs bg-green-900 text-black px-2 font-bold uppercase">Binary Collision</span>
                </div>
            </div>

            <p class="text-green-500 text-sm leading-relaxed max-w-3xl mb-10">
                "{{ sfida.descrizione }}"
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                {% for file_obj in sfida.filesfida_set.all %}
                <div class="p-6 border border-green-900 bg-green-950/5 relative group">
                    <div class="absolute top-0 right-0 p-2 text-green-900 text-[10px] font-mono">#RECOV_{{ forloop.counter }}</div>
                    <h4 class="text-xs text-white mb-4 uppercase tracking-tighter">{{ file_obj.nome }}</h4>
                    <a href="{{ file_obj.file.url }}" class="block w-full border border-green-700 py-2 text-center text-[10px] font-black hover:bg-green-700 hover:text-black transition uppercase" download>
                        Carica_Flusso_Dati
                    </a>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
