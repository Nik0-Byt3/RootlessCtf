{% extends "base2.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="bg-green-900/10 border-x border-t border-green-900 p-4 flex justify-between items-center">
        <span class="text-xs font-bold text-green-500 uppercase tracking-widest">Insecure Handshake Captured</span>
        <span class="w-2 h-2 bg-green-500 animate-pulse rounded-full"></span>
    </div>

    <div class="terminal-border p-10 bg-black shadow-2xl">
        <h1 class="text-3xl font-black text-white text-center mb-8 uppercase tracking-tighter">{{ sfida.titolo }}</h1>

        <div class="max-w-xl mx-auto text-center space-y-8">
            <p class="text-green-400 text-sm italic leading-loose">
                "{{ sfida.descrizione }}"
            </p>

            <div class="py-8 border-y border-green-900/30">
                {% for file_obj in sfida.filesfida_set.all %}
                <a href="{{ file_obj.file.url }}" class="inline-block px-12 py-3 bg-white text-black font-black text-xs uppercase hover:bg-green-500 transition" download>
                    Scompatta_Parametri_Logici
                </a>
                {% endfor %}
            </div>

            <p class="text-[9px] text-green-900 uppercase tracking-[0.2em]">
                System_Node: TURING_DEEP_CORE // Protocol: ASYMMETRIC_PRIME_AUTH
            </p>
        </div>
    </div>
</div>
{% endblock %}
