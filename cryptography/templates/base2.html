<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <title>PROJECT_ENIGMA // TERMINAL</title>
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #020202;
            color: #00ff41;
            overflow-x: hidden;
        }
        .scanline {
            width: 100%; height: 2px;
            background: rgba(0, 255, 65, 0.1);
            position: fixed; top: 0; left: 0;
            z-index: 999; pointer-events: none;
            animation: scan 4s linear infinite;
        }
        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }
        .terminal-border { border: 1px solid #003b11; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="scanline"></div>

    <header class="max-w-6xl mx-auto mb-10 flex justify-between items-end border-b border-green-900 pb-2">
        <div>
            <h2 class="text-xs text-green-900 tracking-[0.3em]">RECOVERY_MODULE::TURING_LEGACY</h2>
            <h1 class="text-xl font-bold uppercase tracking-widest">Enigma_Portal_v2.0.4</h1>
        </div>
        <div class="text-[10px] text-right text-green-800">
            LOC: 51.9753 N / 0.7412 W<br>
            AUTH: ALAN_T_LOG_7
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto mt-20 pt-4 border-t border-green-900 text-[10px] text-green-900 flex justify-between">
        <span>© 1942-2026 BLETCHLEY_PARK_REMNANTS</span>
        <span class="animate-pulse underline cursor-pointer">TERMINATE_SESSION_</span>
    </footer>
</body>
</html>
