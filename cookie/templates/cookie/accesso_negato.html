<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova — Accesso negato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-300 font-mono min-h-screen">

    <!-- Navbar -->
    <header class="border-b border-zinc-800 px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2 text-white font-bold tracking-widest uppercase">
            <span class="text-orange-400">◈</span> ShopNova
        </div>
        <nav class="flex items-center gap-6 text-xs text-zinc-500">
            <a href="{% url 'cookie_home' %}" class="hover:text-white transition-colors">← Torna alla home</a>
        </nav>
    </header>

    <main class="max-w-md mx-auto px-6 py-24 text-center">
        <p class="text-4xl mb-6">🔒</p>
        <h1 class="text-xl font-bold text-white mb-3">Area riservata</h1>
        <p class="text-sm text-zinc-500 mb-6">
            Questa pagina è accessibile solo agli utenti con privilegi speciali.
            la pagina è in fase di development . <!-- accessibile solo ad admin -->
        </p>
        <div class="px-4 py-3 rounded bg-zinc-900 border border-zinc-800 text-xs text-zinc-600 text-left">
            <p>Stato accesso: <span class="text-red-400">negato</span></p>
            <p class="mt-1">Livello utente: <span class="text-zinc-400">standard</span></p>
            <!-- verifica effettuata lato server tramite usr_ctx -->
        </div>
    </main>

</body>
</html>
