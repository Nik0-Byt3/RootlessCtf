<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNova — 🎉 Premio speciale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] } } }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-300 font-mono min-h-screen">

    <!-- Navbar -->
    <header class="border-b border-zinc-800 px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-2 text-white font-bold tracking-widest uppercase">
            <span class="text-orange-400">◈</span> ShopNova
        </div>
        <nav class="flex items-center gap-6 text-xs text-zinc-500">
            <a href="{% url 'cookie_home' %}" class="hover:text-white transition-colors">← Torna alla home</a>
        </nav>
    </header>

    <main class="max-w-md mx-auto px-6 py-20 text-center">
        <p class="text-5xl mb-6">🎉</p>
        <h1 class="text-2xl font-bold text-white mb-2">Sei il nostro 1000° utente!</h1>
        <p class="text-sm text-zinc-500 mb-8">
            Congratulazioni! Hai sbloccato il premio esclusivo riservato al nostro utente speciale.
            Ecco il tuo codice segreto:
        </p>
        <div class="bg-zinc-900 border border-orange-800 rounded-lg px-6 py-4">
            <p class="text-xs text-orange-400 uppercase tracking-widest mb-2">Codice premio</p>
            <p class="text-orange-300 font-bold text-lg tracking-wide font-mono">{{ flag }}</p>
        </div>
    </main>

</body>
</html>
